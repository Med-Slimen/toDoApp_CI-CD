<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Mes tâches</h1>

    <form id="task-form" class="task-form">
      <label for="title" class="visually-hidden">Nouvelle tâche</label>
      <input id="title" name="title" type="text" maxlength="100"
             placeholder="Ajouter une tâche..." required autocomplete="off">
      <button type="submit">Ajouter</button>
    </form>

    <p id="message" class="message" role="status"></p>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>Aucune tâche pour le moment.</p>

    <footer class="footer">Version : <span id="version">…</span></footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
