name: Rollback

# Manual run: Actions tab > Rollback > Run workflow > type the previous version (e.g. v1.0.0)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to go back to (e.g. v1.0.0)'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Redeploy previous version and check health
        env:
          IMAGE_REPO: ${{ steps.meta.outputs.image }}
        run: ./scripts/deploy.sh "${{ github.event.inputs.version }}"
